# Minimal CI template for forks and mirrors.
# The upstream repository uses the full version in .github/workflows/ci.yml
# (Python 3.8-3.13 matrix, packaging check, and a real bridge end-to-end smoke).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -v
      - name: CLI smoke test
        run: |
          lfb --version
          lfb --help
