[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-file-bridge"
version = "0.1.0"
description = "A tiny, secure file bridge between Android and any Linux environment (Ubuntu, proot, chroot, Termux, WSL, servers)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "wangzi5151" }]
keywords = ["android", "linux", "file-sharing", "mcp", "agent", "proot", "termux"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
test = []

[project.scripts]
lfb = "lfb.cli:main"

[project.urls]
Homepage = "https://github.com/wangzi5151/linux-file-bridge"
Issues = "https://github.com/wangzi5151/linux-file-bridge/issues"

[tool.setuptools]
packages = ["lfb"]

[tool.setuptools.package-data]
lfb = ["py.typed"]
